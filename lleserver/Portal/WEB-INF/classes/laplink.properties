mail.newAccountSubject=Important Information About Your Laplink Everywhere Account!
mail.newAccountFrom=llesupport@laplink.com
mail.newAccountBody=Thank you for setting up your Laplink Everywhere account.  You are now ready to experience anytime, anywhere remote access to your PC.\n\nWith Laplink Everywhere, you can now access and control your remote PCs to use applications, files and network resources or view and update your Outlook e-mail, contacts, calendar and tasks as if you were sitting in front of your PC.\n\nYou need to install Laplink Everywhere on EACH computer that you wish to access remotely; just click or go to http://www.LL2go.com/lle-setup.exe.  Each PC you set up automatically receives a trial.  After the trial period is complete, you will need to enter a serial number for each PC in the "My Account" tab at http://www.LL2go.com to continue using Laplink Everywhere.\n\nIf you are only using a trial, please remember to try out all functions of Laplink Everywhere before your trial expires.  Then, visit http://www.laplink.com/lle/pricing.html to buy a full license to Laplink Everywhere.\n\n\nWhile giving you complete remote access to your PC, Laplink Everywhere protects your data and all connections with 128 bit encryption to ensure that your personal information is always secure.  And there's no need to fuss with firewall configurations - you connect through multiple firewalls quickly and securely.\n\nHere is a reminder of some of the features Laplink Everywhere offers:\n\n-  Remote control:   Remotely control your PC as if you were sitting in front of it.\n\n-  Remote desktop search powered by Google:   Search your remote computers for files, e-mail, and more.  To use this functionality, visit: http://desktop.google.com/ and install Google Desktop Search on each PC you wish to search remotely with Laplink Everywhere.\n\n-  Firewall Connect:   Connect to your PCs through multiple firewalls and routers without any configurations or compromising security.\n\n-  File transfer:   Move files easily between your computers and distribute files easily to others from remote PCs.\n\n-  Web access to your e-mail and PIM data:   Access & update e-mail, calendar, contacts, tasks and notes.\n\n-  Support for handheld devices:   Use your web-enabled PDA or Smartphone to remotely access your information.\n\n\nIf you have any questions or require technical support for your Laplink Everywhere visit http://www.laplink.com/contact.\n\n\nComplete mobility is now yours with Laplink Everywhere.  Enjoy the freedom from your PC!\n

