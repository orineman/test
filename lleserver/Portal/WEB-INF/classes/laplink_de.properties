msg.passwordRecoveryHint=Hinweis: Wenn Sie Ihren Benutzernamen vergessen haben, dann öffnen Sie auf Ihrem PC die Laplink Everywhere Konsole, wählen Sie dann "Konfigurieren->Benutzer" aus und sehen Sie sich den Eintrag "Me" an.

mail.newAccountSubject=Willkommen bei Laplink Everywhere!
mail.newAccountFrom=llesupport@laplink.com
mail.newAccountBody=Vielen Dank dass Sie sich ein Konto bei Laplink Everywhere www.LL2go.com eingerichtet haben, welches Ihnen "jederzeit und weltweit " den Zugriff auf Ihren entfernten PC erlaubt!\n\n\nHier ein paar hilfreiche Tipps:\n\n-  Installieren Sie Laplink Everywhere auf JEDEM PC, auf den Sie entfernt zugreifen möchten. Hierzu brauchen Sie nur auf den folgenden Link zu klicken www.ll2go.com/lle-setup_de.exe. Nach dem Ende der kostenlosen Testperiode müssen Sie für jeden Ihrer PCs eine Seriennummer im Bereich „Ihr Konto“ unter www.LL2go.com eingeben, um Laplink Everywhere weiterhin nutzen zu können.  (Auf der folgenden Webseite können Sie weitere Seriennummern erwerben: www.laplink.com/de/products/lle/plans.asp).\n\n- Die Integration von Google Desktop-Suche in Laplink Everywhere bietet Ihnen ein erstaunliches Hilfsmittel. Probieren Sie dessen Funktionsweise, um Ihren entfernten Desktop - selbst von Ihrem mobilen Handhelds aus - zu durchsuchen. Es existiert kein vergleichbares Programm für den mobilen Profi! Besuchen Sie bitte:  http://desktop.google.com/?hl=de und installieren Sie Google Desktop-Suche auf Ihrem PC, wenn Sie die entfernte Suchfunktion mit Laplink Everywhere nutzen wollen.\n\n- Verwenden Sie Laplink Everywheres "Dateiübertragungs" Funktion, um Daten zwischen zwei PCs zu übertragen (z.B. Heim- und Büro-PC), sicher und verschlüsselt über das Internet, optimiert durch Laplinks patentierte SpeedSync Technologie.\n\n\nWICHTIGER HINWEIS:  Stellen Sie sicher, dass Ihre Laplink Everywhere Anmeldeinformationen vertraulich behandeln werden. Sollten Sie diese Daten in irgendeiner Weise speichern, verwenden Sie bitte einen sicheren und geschützten Ort.\n\n\nWenn Sie technische Fragen haben, besuchen Sie bitte:  www.laplink.com/de/support/lle.asp.  Wenn Sie rabattierte Mehrfachlizenzen erwerben wollen, kontaktieren Sie uns bitte per E-Mail unter CorpSales@laplink.com. Für alle anderen Fragen über Laplink Everywhere oder andere Laplink Produkte, besuchen Sie uns bitte unter www.laplink.de oder wählen Sie +1 425 952 6001.\n\nVielen Dank für Ihr Vertrauen. Wir wissen Sie als Laplink Kunden zu schätzen!\n\n\nViele Grüße,\n\nIhr Laplink Everywhere Kundendienst\n\n\nKOSTENLOSES ANGEBOT:  Für begrenzte Zeit! Besuchen Sie bitte www.filesender.com und verwenden Sie FileSender zur Versendung von Dateien jeglicher Art und Größe an jeden Empfänger, sicher und geschützt. Keine Probleme mehr mit diversen Dateien als E-Mail Anlagen!

