msg.rcexpired=Ihre kostenlose Teststunde für die Fernsteuerung ist abgelaufen.
msg.rcoverview=Laplink Everywhere liefert Ihnen das umfassenste Packet an Fernsteuerungstechniken, um Ihnen die optimale Arbeitserfahrung zu geben.
msg.remotedesktop=Benutzen Sie diese Funktion, wenn Sie eine Verbindung von einem Windows PC zu einem Windows XP Professional oder Windows Server 2000/2003 mit den Terminaldiensten herstellen möchten.
msg.winshadow=Benutzen Sie diese Funktion, wenn Sie eine Verbindung von einem Windows PC zu einem Windows XP Home, Windows 2000, Windows Me oder Windows 98SE Computer herstellen möchten.
msg.vnc=Benutzen Sie diese Funktion, wenn Sie von einem Macintosh oder Linux/Unix basiertem Computer ein Verbindung herstellen möchten.
msg.rdp1=1. Klicken Sie oben auf die Meldung, die sagt, dass;<br>&nbsp;&nbsp;&nbsp; ""Diese Seite benötigt das folgende ActiveX-Steuerelement: 'LaplinkRdp.dll' von 'Laplink Software'.""<br><br>2. Klicken Sie im Dropdown-Menü auf 'ActiveX-Steuerelement installieren...'.<br><br>3. Klicken Sie, wenn eine Sicherheitsmeldung erscheint, auf die Schaltfläche 'Installieren'.<br>
msg.rdp2=Laplink Everywhere installiert jetzt das Remote Desktop ActiveX-Steuerelement.<br>Dieses Steuerelement macht Sie dazu fähig, so mit Ihrem Remote-PC zu kommunizieren, als ob Sie davor sitzen würden.<br><br>Bitte wählen Sie bei Aufforderung 'Installieren' aus<br><br>Wenn Ihr Spyware-Blocker Sie darüber informiert, dass das LaplinkRDP Modul versucht eine Verbindung zum Internet herzustellen, dann wählen Sie bitte ""Akzeptieren"" oder ""Erlauben"" oder eine vergleichbare Schaltfläche aus.
msg.vncdownload=Bitte warten Sie bis der Laplink Secure VNC Java-Viewer heruntergeladen ist. Dies kann ein paar Minuten daueren.
msg.vncstart=Fernsteuerung starten
msg.winshadow1=1. Klicken Sie oben auf die Meldung, die sagt, dass;<br>&nbsp;&nbsp;&nbsp; ""Diese Seite benötigt das folgende  ActiveX-Steuerelement: 'ActiveXShadow.cab von 'Laplink Software'.""<br><br>2. Klicken Sie im Dropdown-Menü auf 'ActiveX-Steuerelement installieren...'.<br><br>3. Klicken Sie, wenn eine Sicherheitsmeldung erscheint, auf die Schaltfläche 'Installieren'.<br>
msg.winshadow2=Laplink Everywhere installiert jetzt das Fernsteuerung 4 ActiveX-Steuerelement.<br>Dieses Steuerelement macht Sie dazu fähig, so mit Ihrem Remote-PC zu kommunizieren, als ob Sie davor sitzen würden.<br><br>Bitte wählen Sie bei Aufforderung 'Installieren' aus<br><br>Wenn Ihr Spyware-Blocker Sie darüber informiert, dass das ActiveXShadow Modul versucht eine Verbindung zum Internet herzustellen, dann wählen Sie bitte ""Akzeptieren"" oder ""Erlauben"" oder eine vergleichbare Schaltfläche aus.
