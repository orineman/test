msg.rdp1=1. Haga clic en el mensaje de arriba que indica;<br>&nbsp;&nbsp;&nbsp; "Este sitio puede necesitar el siguiente control ActiveX: 'LaplinkRdp.dll' de 'Laplink Software'."<br><br>2. Haga clic en 'Instalar control ActiveX...' en el men&#250; desplegable.<br><br>3. Haga clic en el bot&#243;n 'Instalar' cuando aparezca el mensaje de advertencia de seguridad.<br>
msg.rdp2=Laplink Everywhere est&#225; instalando ahora el control ActiveX Escritorio remoto.<br>Este control le permitir&#225; comunicarse con los PC remotos como si estuviera sentado delante de ellos.<br><br>Si se le solicita, seleccione 'Instalar'.<br><br>Si el programa de bloqueo de spyware le notifica que el m&#243;dulo LaplinkRDP est&#225; intentando conectarse a Internet, haga clic en "Aceptar" o en "Permitir" (o en un bot&#243;n similar).
