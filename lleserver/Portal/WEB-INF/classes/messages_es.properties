msg.winshadow2=Laplink Everywhere est&#225; instalando ahora el control ActiveX Remote Control 4.<br>Este control le permitir&#225; comunicarse con los PC remotos como si estuviera sentado delante de ellos.<br><br>Si se le solicita, seleccione 'Instalar'.<br><br>Si el programa de bloqueo de spyware le notifica que el m&#243;dulo ActiveXShadow est&#225; intentando conectarse a Internet, haga clic en "Aceptar" o en "Permitir" (o en un bot&#243;n similar).
