mail.newAccountSubject=[Laplink Internet] Vielen Dank für Ihre Registrierung!
mail.newAccountFrom=support@laplink.com
mail.newAccountBody=Nochmals vielen Dank für Ihre Laplink Internet Registrierung.\n\nZur leichteren Handhabung, hier eine paar Tips wie Sie \nauf Ihre PCs zugreifen können.\n\n-Installieren Sie Laplink Gold auf alle PC, auf welche Sie zugreifen wollen.\n\n-Starten Sie Laplink Gold auf diesen PCs und wenn Sie zur Registrierung aufgefordert werden\nwählen Sie Ja und führen Sie die angegebenen Registrierungsschritte durch\n\n\nWenn Sie weiterführende Hilfe benötigen, kontaktieren Sie bitte die technische Unterstützung von Laplink unter http://www.laplink.com/de/support/laplink.asp.\n\nMit Freundlichen Grüßen,\nLaplink Internet Support\n
