
org.apache.commons.logging.LogFactory=org.apache.commons.logging.impl.Log4jFactory

#log4j.rootCategory=debug, stdout, R, mail
log4j.rootCategory=debug, R

log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=/lle/system/portal/WEB-INF/proto.log
log4j.appender.R.MaxFileSize=100KB
# Keep one backup file
log4j.appender.R.MaxBackupIndex=100

log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%-5p %d  %c -- %m %n

# Jakarta messages 
log4j.category.org.apache=WARN

# hibernate
log4j.category.net.sf.hibernate=WARN

# Http Client
log4j.category.httpclient=ERROR
log4j.category.org.apache.commons.httpclient=ERROR


# Disable a few annoying messages during development

#log4j.category.com.infowave.c4p.web.actions.Process404Error=ERROR
log4j.category.com.infowave.c4p.web.tags.ResourceTag=WARN
