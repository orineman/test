mail.newAccountSubject=[Laplink Internet] Grazie per aver effettuato la registrazione!
mail.newAccountFrom=support@laplink.com
mail.newAccountBody=Vi ringraziamo nuovamente per aver effettuato la registrazione per Laplink Internet.\n\nPer vostra convenienza, eccovi alcuni suggerimenti per accedere ai\nvostri PC.\n\n-Installate Laplink Gold su ciascun PC a cui volete accedere.\n\n-Eseguite Laplink Gold su questi PC e quando vi viene richiesto di effettuare la registrazione\n selezionate 'Sì' e seguite le istruzioni fornite per la registrazione.\n\n\nPer richiedere ulteriore assistenza, contattate l'Assistenza Tecnica Laplink nel sito http://www.laplink.com/support/laplink.asp.\n\nRegards,\nLaplink Internet Support\nsupport@laplink.com\n