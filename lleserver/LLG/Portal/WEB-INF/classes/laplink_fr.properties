mail.newAccountSubject=[Laplink Internet] Merci pour votre inscription!
mail.newAccountFrom=support@laplink.com
mail.newAccountBody=Nous vous remercions pour votre inscription à Laplink Internet. \n\nPour votre commodité, voici quelques conseilles pour connecter à\nvos ordinateurs.\n\n-Installez Laplink Gold sur chaque ordinateur auxquels vous aimeriez vous connecter.\n\n-Exécutez Laplink Gold sur chaque ordinateur et au moment vous avez le message pour enregistrer l’ordinateur avec le service Laplink Internet\n cliquez sur Oui et suivez les instructions.\n\n\nSi vous avez besoin de l’assistance supplémentaire, s’il vous plait contactez l’assistance technique de Laplink au http://www.laplink.com/support/laplink.asp.\n\nCordialement,\nL’équipe Laplink Internet\nsupport@laplink.com\n
