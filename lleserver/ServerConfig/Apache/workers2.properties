#
#[logger]
#level=debug

[config]
debug=10
debugEnv=10

[uriMap:]
info=Maps the requests. Options: debug
debug=1

[shm]
#file=/lle/dist/httpd/conf/shm.file
#size=1048576
file=anonymous

[workerEnv:]
info=Global server options
timing=1
debug=0

[lb:lb]
info=Default load balancer.
debug=0

# Define the communication channel
[channel.socket:localhost:8009]
info=Ajp13 forwarding over socket
tomcatId=localhost:8009
lb_factor=50
group=lb

# Map the Laplink Everywhere Web Server
[uri:www.ll2go.com/*]
info=c4

